[project]
name = "apple-fill"
version = "0.1.0"
description = "Extract product facts and fill official forms up to, but not including, submit."
requires-python = ">=3.11"
dependencies = [
  "fpdf2>=2.8.0",
  "jsonschema>=4.21.0",
  "pillow>=10.0.0",
  "playwright>=1.40.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
apple-fill = "apple_fill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apple_fill = ["schemas/*.json", "demo_site/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
